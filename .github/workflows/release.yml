name: Release Pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix app
      - run: npm test --prefix app

  deploy-local-lab:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build a traceable image
        run: docker build -t orderflow:${{ github.sha }} .
      - name: Deploy and verify on the isolated runner
        env:
          IMAGE: orderflow:${{ github.sha }}
        run: |
          bash scripts/deploy.sh "$IMAGE"
          docker inspect orderflow-ca3 --format '{{.Image}}'
      - name: Clean up the lab container
        if: always()
        run: docker rm -f orderflow-ca3 || true

  production-readiness:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [validate, deploy-local-lab]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record approved release candidate (no production deployment)
        run: echo "OrderFlow 2.3.0 candidate $GITHUB_SHA passed validation and environment review."
